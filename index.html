<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修仙界人格测试</title>
  <link rel="stylesheet" href="./files/main.css">
</head>
<body>
  <div class="shell">
    <section id="intro" class="screen active">
      <div class="hero card hero-minimal">
        <h1>凡人测MBTI，修仙者测道骨！</h1>
        <div class="hero-actions hero-actions-single">
          <button id="startBtn" class="btn-primary">开启测骨</button>
        </div>
      </div>
    </section>

    <section id="test" class="screen">
      <div class="test-wrap card">
        <div class="topbar">
          <div class="progress"><span id="progressBar"></span></div>
          <div class="progress-text" id="progressText">0 / 31</div>
        </div>

        <div id="questionList" class="question-list"></div>

        <div class="actions-bottom">
          <div class="hint" id="testHint">道骨测试岂可敷衍？修仙之路漫漫，先把题做完再说！</div>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button id="backIntroBtn" class="btn-secondary">返回山门</button>
            <button id="submitBtn" class="btn-primary" disabled>揭晓道骨</button>
          </div>
        </div>
      </div>
    </section>

    
    <section id="result" class="screen">
      <div class="result-wrap card">
        <div class="result-layout">
          <div class="result-top">
            <div class="poster-box" id="posterBox">
              <img id="posterImage" class="poster-image" alt="人格结果图">
              <div id="posterCaption" class="poster-caption">怎么样，被我拿捏了吧？</div>
            </div>

            <div class="type-box">
              <div class="type-kicker" id="resultModeKicker">你的道骨</div>
              <div class="type-name" id="resultTypeName">CTRL（拿捏者）</div>
              <div class="match" id="matchBadge">匹配度 92%</div>
              <div class="type-subname" id="resultTypeSub">系统备注会显示在这里。</div>
            </div>
          </div>

          <div class="analysis-box">
            <h3>道骨解析</h3>
            <p id="resultDesc"></p>
          </div>

          <div class="dim-box">
            <h3>修仙资质评分</h3>
            <div id="dimList" class="dim-list"></div>
          </div>

          <div class="note-box">
            <h3>友情提示</h3>
            <p id="funNote">此测骨仅供娱乐，莫当真！修仙之路漫漫，道骨只是参考，修行还需自身努力！</p>
          </div>

                    <details class="author-box">
            <summary>作者的话</summary>
            <div class="author-content">
              <p>本测试首发于b站up主蛆肉儿串儿（UID417038183）</p>
            </div>
          </details>
        </div>

        <div class="result-actions">
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button id="restartBtn" class="btn-secondary">再测一次</button>
            <button id="toTopBtn" class="btn-primary">回到山门</button>
          </div>
        </div>
      </div>
    </section>

  </div>

  
  <script src="./files/main.js">
    
  </script>

</body>
</html>
